name: Public installed-upgrade verification
run-name: ${{ format('Drape {0} {1}', github.event.action == 'drape-draft-probe' && 'draft probe' || github.event.action == 'drape-overlay-test' && 'overlay' || 'candidate', github.event.client_payload.nonce) }}

on:
  repository_dispatch:
    types: [drape-candidate, drape-draft-probe, drape-overlay-test]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'id02041985-del/shtorka-releases' && github.event.action == 'drape-candidate'
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check unpublished candidate against previous public installer
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          DRAPE_OLD: ${{ github.event.client_payload.oldVersion }}
          DRAPE_NEW: ${{ github.event.client_payload.newVersion }}
          DRAPE_SHA: ${{ github.event.client_payload.installerSha256 }}
          DRAPE_BYTES: ${{ github.event.client_payload.installerBytes }}
          DRAPE_SOURCE: ${{ github.event.client_payload.sourceSha }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./.github/scripts/verify-upgrade.ps1 -Mode candidate -OldVersion $env:DRAPE_OLD -NewVersion $env:DRAPE_NEW -ExpectedNewSha256 $env:DRAPE_SHA -ExpectedNewBytes ([long]$env:DRAPE_BYTES) -SourceSha $env:DRAPE_SOURCE
          } catch {
            $reason = $_.Exception.Message -replace 'https?://\S+', '[URL]' -replace '(?i)(Bearer|Authorization|Token)\S*', '[redacted]'
            $reason = $reason -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            if ($reason.Length -gt 240) { $reason = $reason.Substring(0, 240) }
            Write-Host ('::error title=Candidate verification failure::' + $reason)
            throw 'Candidate verification failed; draft remains unpublished.'
          }

  probe-draft:
    if: github.repository == 'id02041985-del/shtorka-releases' && github.event.action == 'drape-draft-probe'
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify authenticated draft download without publishing
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          DRAPE_NONCE: ${{ github.event.client_payload.nonce }}
          DRAPE_SHA: ${{ github.event.client_payload.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:DRAPE_NONCE -notmatch '^[a-f0-9]{32}$' -or
              $env:DRAPE_SHA -notmatch '^[a-f0-9]{64}$') { throw 'Invalid disposable draft probe.' }
          $tag = "drape-probe-$env:DRAPE_NONCE"
          $repo = 'id02041985-del/shtorka-releases'
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $draftJson = & gh release view $tag --repo $repo --json databaseId,isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw 'Temporary draft could not be resolved.' }
          $draftInfo = $draftJson | ConvertFrom-Json
          if (!$draftInfo.isDraft -or $draftInfo.tagName -cne $tag -or $draftInfo.databaseId -le 0) { throw 'Temporary draft identity mismatch.' }
          $draft = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($draftInfo.databaseId)" -Headers $headers -TimeoutSec 60
          $asset = @($draft.assets | Where-Object name -CEQ 'probe.txt')
          if (!$draft.draft -or $draft.tag_name -cne $tag -or $asset.Count -ne 1 -or
              $asset[0].digest -ine "sha256:$env:DRAPE_SHA") { throw 'Draft asset metadata mismatch.' }
          & gh release download $tag --repo $repo --pattern probe.txt --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated draft download failed.' }
          $file = Join-Path $env:RUNNER_TEMP 'probe.txt'
          if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ine $env:DRAPE_SHA -or
              (Get-Item -LiteralPath $file).Length -ne $asset[0].size) { throw 'Draft bytes mismatch.' }
          "Verified private draft asset on disposable GitHub-hosted Windows; tag $tag." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  overlay-ui:
    if: github.repository == 'id02041985-del/shtorka-releases' && github.event.action == 'drape-overlay-test'
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test exact unpublished portable candidate on disposable Windows desktop
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          DRAPE_NONCE: ${{ github.event.client_payload.nonce }}
          DRAPE_SHA: ${{ github.event.client_payload.sha256 }}
          DRAPE_SOURCE: ${{ github.event.client_payload.sourceSha }}
          DRAPE_MSIX_TEST: ${{ github.event.client_payload.msixTest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'identity'
          try {
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:DRAPE_NONCE -notmatch '^[a-f0-9]{32}$' -or
              $env:DRAPE_SHA -notmatch '^[a-f0-9]{64}$' -or $env:DRAPE_SOURCE -notmatch '^[a-f0-9]{40}$') {
            throw 'Invalid isolated overlay candidate identity.'
          }
          $repo = 'id02041985-del/shtorka-releases'
          $tag = "drape-overlay-test-$env:DRAPE_NONCE"
          $stage = 'draft lookup'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases?per_page=100" -Headers $headers -TimeoutSec 60
          $matches = @($releases | Where-Object tag_name -CEQ $tag)
          if ($matches.Count -ne 1 -or !$matches[0].draft) { throw 'Exact unpublished draft missing.' }
          $assets = @($matches[0].assets | Where-Object name -CEQ 'drape-overlay-payload.zip')
          if ($assets.Count -ne 1 -or $assets[0].digest -ine "sha256:$env:DRAPE_SHA") { throw 'Candidate digest mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP 'drape-overlay-check'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $zip = Join-Path $root 'drape-overlay-payload.zip'
          $stage = 'candidate download'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & gh release download $tag --repo $repo --pattern drape-overlay-payload.zip --dir $root --clobber
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and
                (Get-FileHash $zip -Algorithm SHA256).Hash -ieq $env:DRAPE_SHA -and
                (Get-Item $zip).Length -eq $assets[0].size) { break }
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            if ($attempt -eq 3) { throw 'Exact unpublished candidate download failed.' }
            Start-Sleep -Seconds 10
          }
          $app = Join-Path $root 'app'
          $stage = 'candidate extraction'
          Expand-Archive -LiteralPath $zip -DestinationPath $app
          $exe = Join-Path $app 'Shtorka.exe'
          if (!(Test-Path $exe)) { throw 'Candidate executable missing.' }
          # Downloads are complete. Desktop applications must not inherit the
          # workflow's temporary GitHub/artifact tokens.
          foreach ($name in @('GH_TOKEN', 'GITHUB_TOKEN', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          if ($env:DRAPE_MSIX_TEST -ceq 'true') {
            $stage = 'official ChatGPT MSIX preparation'
            & './.github/scripts/prepare-chatgpt-fixture.ps1'
          }
          $stage = 'signed extension bridge'
          $env:SHTORKA_OBYEZD_TEST_PACKAGES = $app
          $bridgeRoot = Join-Path $root 'synthetic-obyezd-bridge'
          $bridge = Start-Process -FilePath $exe -WorkingDirectory $app -ArgumentList @('--verify-obyezd-bridge', '--data-dir', ('"' + $bridgeRoot + '"')) -PassThru
          try {
            if (!$bridge.WaitForExit(90000) -or $bridge.ExitCode -ne 0) { throw 'Installed candidate extension bridge check did not complete.' }
            $bridgeReport = Join-Path $bridgeRoot 'obyezd-bridge-checks.json'
            if (!(Test-Path $bridgeReport)) { throw 'Installed candidate extension bridge report missing.' }
            $bridgeParsed = ConvertFrom-Json -InputObject (Get-Content $bridgeReport -Raw)
            $bridgeChecks = New-Object 'System.Collections.Generic.List[object]'
            foreach ($check in $bridgeParsed) { $bridgeChecks.Add($check) }
            if ($bridgeChecks.Count -ne 4 -or @($bridgeChecks | Where-Object { !$_.pass }).Count -ne 0) {
              throw 'Installed candidate extension did not receive a valid app state response.'
            }
            'Real signed Obyezd extension received state from the exact unpublished portable Windows candidate; no tunnel started.' |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } finally {
            if (!$bridge.HasExited) { Stop-Process -Id $bridge.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:SHTORKA_OBYEZD_TEST_PACKAGES -ErrorAction SilentlyContinue
          }
          $stage = 'legacy SetParent negative control'
          $crashRoot = Join-Path $root 'synthetic-parent-crash'
          $probe = Start-Process -FilePath $exe -WorkingDirectory $app -ArgumentList @('--verify-program-parent-crash', ('"' + $crashRoot + '"')) -PassThru
          try {
            if (!$probe.WaitForExit(30000) -or $probe.ExitCode -ne 0) { throw 'Synthetic parent crash probe did not complete.' }
            $crashReport = Join-Path $crashRoot 'program-parent-crash.json'
            if (!(Test-Path $crashReport)) { throw 'Synthetic parent crash report missing.' }
            $crash = ConvertFrom-Json -InputObject (Get-Content $crashReport -Raw)
            if (!$crash.parentKilled) { throw 'Synthetic parent process did not stop.' }
            # This deliberately exercises the disabled legacy SetParent path.
            # Its measured failure explains why that path remains unavailable;
            # it must not prevent the independent top-level host checks below.
            "Legacy SetParent negative control: parentKilled=$($crash.parentKilled); windowSurvived=$($crash.windowSurvived); restoredTopLevel=$($crash.restoredTopLevel). This is not a new-host safety result." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } finally {
            if (!$probe.HasExited) { Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue }
          }
          $profile = Join-Path $root 'synthetic-profile'
          $stage = 'installed app startup'
          $process = Start-Process -FilePath $exe -WorkingDirectory $app -ArgumentList @('--verify-program-overlay', '--data-dir', ('"' + $profile + '"')) -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(10)
            while (!$process.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2; $process.Refresh() }
            if (!$process.HasExited) { throw 'Candidate desktop check timed out.' }
            $report = Join-Path $profile 'program-overlay.json'
            if (!(Test-Path $report)) { throw 'Candidate desktop report missing.' }
            $stage = 'report parsing'
            # Windows PowerShell 5.1 may emit the JSON array as one pipeline object.
            # Enumerate the parsed value explicitly before counting fixture checks.
            $parsed = ConvertFrom-Json -InputObject (Get-Content $report -Raw)
            $checks = New-Object 'System.Collections.Generic.List[object]'
            $fail = New-Object 'System.Collections.Generic.List[object]'
            foreach ($check in $parsed) {
              $checks.Add($check)
              if (!$check.pass) { $fail.Add($check) }
            }
            $stage = 'program operations'
            $sharedProof = @($checks | Where-Object { $_.pass -and $_.name -ceq 'Destroying the drawer owner restores the ordinary application window with unsaved text' })
            $msixProof = @($checks | Where-Object { $_.pass -and $_.name -ceq 'Installed ChatGPT MSIX restores its ordinary window without changing its account or network mode' })
            if ($process.ExitCode -ne 0 -or $checks.Count -lt 30 -or $fail.Count -gt 0 -or $sharedProof.Count -ne 1) {
              $names = ($fail | Select-Object -ExpandProperty name) -join ', '
              throw "Candidate UI checks failed: $names; count $($checks.Count); exit $($process.ExitCode)."
            }
            if ($env:DRAPE_MSIX_TEST -ceq 'true' -and $msixProof.Count -ne 1) { throw 'Installed ChatGPT MSIX proof missing.' }
            "Exact source $env:DRAPE_SOURCE; $($checks.Count) disposable Windows operations passed, including shared drawer input, site/program switching and crash recovery." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
          } catch {
            # This annotation is visible through the Checks API when hosted runner logs are unavailable.
            # Only fixed stage labels and fixture check names are exposed, never raw child stderr.
            $reason = $_.Exception.GetType().Name
            if ($stage -eq 'official ChatGPT MSIX preparation' -and $_.Exception.Message -cmatch '^CHATGPT_[A-Z0-9_.]{1,180}$') {
              $reason = $_.Exception.Message
            }
            if ($stage -eq 'signed extension bridge' -and $null -ne $bridgeChecks) {
              $bridgeFailures = @($bridgeChecks | Where-Object { !$_.pass })
              $names = (($bridgeFailures | Select-Object -ExpandProperty name) -join ', ') -replace '[^a-zA-Z0-9 ,.-]', ''
              $reason = "checks=$($bridgeChecks.Count); failed=" + $names.Substring(0, [Math]::Min(160, $names.Length))
            }
            if ($stage -eq 'program operations') {
              $names = (($fail | Select-Object -ExpandProperty name) -join ', ') -replace '[^a-zA-Z0-9 ,.-]', ''
              $last = [string](@($checks | Where-Object pass | Select-Object -Last 1).name)
              $last = $last -replace '[^a-zA-Z0-9 ,.-]', ''
              $kind = ''
              $exceptionCheck = @($fail | Where-Object name -eq 'Exception')
              if ($exceptionCheck.Count -eq 1 -and [string]$exceptionCheck[0].detail -match '^([A-Za-z0-9]+Exception):') {
                $kind = $Matches[1]
              }
              $inputReason = if ($exceptionCheck.Count -eq 1 -and [string]$exceptionCheck[0].reason -cin
                @('EDIT_BOUNDS', 'POINTER_POSITION', 'POINTER_OCCLUDED', 'POINTER_FOCUS', 'WHEEL_NO_SCROLL',
                  'DRAWER_ANCHOR', 'WINDOW_MISSING', 'WINDOW_ID_CHANGED', 'MINIMUM_WIDTH', 'MINIMUM_HEIGHT', 'FOCUS_REJECTED', 'RESTORATION_PENDING', 'LAYOUT_UNCONFIRMED',
                  'HOST_START_FAILED', 'TARGET_EXITED', 'FRAME_REJECTED', 'BOUNDS_REJECTED', 'POSITION_NATIVE_ERROR',
                  'MSIX_ACTIVATION_REJECTED', 'MSIX_WINDOW_TIMEOUT', 'MSIX_LAYOUT_TIMEOUT', 'MSIX_AUTOMATION_TIMEOUT', 'DRAWER_WAIT_TIMEOUT')) {
                [string]$exceptionCheck[0].reason
              } else { '' }
              $reason = "checks=$($checks.Count); exit=$($process.ExitCode); failed=" +
                $names.Substring(0, [Math]::Min(100, $names.Length)) + '; kind=' + $kind + '; diagnostic=' + $inputReason + '; after=' +
                $last.Substring(0, [Math]::Min(180, $last.Length))
            }
            Write-Host "::error title=Overlay UI test::$stage; $reason"
            throw
          }

